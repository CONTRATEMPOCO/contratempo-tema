<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CONTRATEMPO© — Em breve</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EEE8DA}a:hover{color:#CD6547}
h1,h2,h3,p,a,span{overflow-wrap:break-word}
#email::placeholder{color:#02070A;opacity:1}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.menu-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:40px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.9fr) repeat(4,minmax(0,1fr));gap:40px 24px}
@keyframes contratempo{0%,55%{transform:translateY(0)}65%,85%{transform:translateY(7.5px)}100%{transform:translateY(0)}}
.pulo{animation:contratempo 4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes contratempo-g{0%,55%{transform:translateY(0)}65%,85%{transform:translateY(18px)}100%{transform:translateY(0)}}
.pulo-g{animation:contratempo-g 4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.selo-gira{transform-origin:60px 60px;animation:gira 24s linear infinite}
@media (prefers-reduced-motion: reduce){.pulo,.pulo-g,.selo-gira{animation:none}}

@media (max-width: 1000px){.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foot-grid>:first-child{grid-column:1/-1}.nav-desk{display:none !important}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.menu-grid{grid-template-columns:1fr}}
@media (max-width: 560px){.hdr-icons .opt{display:none !important}}
@media (max-width: 420px){.g4{grid-template-columns:1fr}}
.pdp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start}
.pdp-info{position:sticky;top:20px}
.cart{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:48px;align-items:start}
.acc summary{list-style:none;cursor:pointer}.acc summary::-webkit-details-marker{display:none}
.acc[open] .mais{transform:rotate(45deg)}
input::placeholder{color:rgba(238,232,218,0.55);opacity:1}
@media (max-width: 1000px){.pdp,.cart{grid-template-columns:1fr}.pdp-info{position:static}}
</style>
</helmet>
<div style="background: #02070A; color: #EEE8DA; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden">
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 28px 20px">
<header style="display: flex; justify-content: center">
<div aria-label="CONTRATEMPO©" style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div aria-hidden="true" style="position: relative; width: 35px; height: 12.5px"><span style="position: absolute; left: 0px; top: 7.5px; width: 5px; height: 5px; border-radius: 50%; background: #EEE8DA"></span><span style="position: absolute; left: 10px; top: 7.5px; width: 5px; height: 5px; border-radius: 50%; background: #EEE8DA"></span><span class="pulo" style="position: absolute; left: 20px; top: 0px; width: 5px; height: 5px; border-radius: 50%; background: #EEE8DA"></span><span style="position: absolute; left: 30px; top: 7.5px; width: 5px; height: 5px; border-radius: 50%; background: #EEE8DA"></span></div><span style="font-family: 'Poppins', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; font-size: 18px; letter-spacing: 0.1em; white-space: nowrap">CONTRATEMPO<span style="font-size: 0.55em; vertical-align: super; letter-spacing: 0">©</span></span></div>
</header>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 56px 0">
<div style="width: 100%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #90E04B">COLEÇÃO 001 · EM BREVE</span>
<h1 style="margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(52px, 9vw, 136px); line-height: 0.88">O Brasil no nosso próprio ritmo.</h1>
<p style="margin: 0; max-width: 520px; font-size: 17px; line-height: 1.6; color: rgba(238,232,218,0.85)">A loja abre em breve. Deixe seu e-mail e a gente avisa no dia, antes de todo mundo.</p>
<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<form onSubmit="{{send}}" style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 560px; text-align: left">
<label for="email-breve" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em">SEU E-MAIL · UM AVISO, SEM ENXURRADA</label>
<div style="display: flex; flex-wrap: wrap"><input id="email-breve" type="email" autocomplete="email" placeholder="nome@email.com" style="min-height: 52px; padding: 0 16px; border: 1px solid rgba(238,232,218,0.5); background: transparent; color: #EEE8DA; font-size: 16px; font-family: inherit; border-radius: 0; box-sizing: border-box; min-width: 0; flex: 1 1 240px; border: 1px solid #EEE8DA"><button type="submit" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border: 0; background: #90E04B; color: #02070A; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; font-weight: 500; cursor: pointer; min-height: 52px">QUERO SER AVISADO</button></div>
</form>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #90E04B; min-height: 52px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>PRONTO. VOCÊ VAI SABER PRIMEIRO.</p>
</sc-if>
</div>
</main>
<footer style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; border-top: 1px solid rgba(238,232,218,0.2); padding-top: 20px">
<div style="display: flex; align-items: center; gap: 20px">
<svg width="112" height="112" viewBox="0 0 120 120" role="img" aria-label="Selo Feita no Brasil" style="flex-shrink: 0">
<circle cx="60" cy="60" r="58" fill="none" stroke="#EEE8DA" stroke-width="1"></circle>
<g class="selo-gira" fill="#EEE8DA" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500"><text x="60.00" y="16.00" transform="rotate(0.0 60.00 16.00)" text-anchor="middle" dominant-baseline="central">F</text><text x="67.64" y="16.67" transform="rotate(10.0 67.64 16.67)" text-anchor="middle" dominant-baseline="central">E</text><text x="75.05" y="18.65" transform="rotate(20.0 75.05 18.65)" text-anchor="middle" dominant-baseline="central">I</text><text x="82.00" y="21.89" transform="rotate(30.0 82.00 21.89)" text-anchor="middle" dominant-baseline="central">T</text><text x="88.28" y="26.29" transform="rotate(40.0 88.28 26.29)" text-anchor="middle" dominant-baseline="central">A</text><text x="98.11" y="38.00" transform="rotate(60.0 98.11 38.00)" text-anchor="middle" dominant-baseline="central">N</text><text x="101.35" y="44.95" transform="rotate(70.0 101.35 44.95)" text-anchor="middle" dominant-baseline="central">O</text><text x="104.00" y="60.00" transform="rotate(90.0 104.00 60.00)" text-anchor="middle" dominant-baseline="central">B</text><text x="103.33" y="67.64" transform="rotate(100.0 103.33 67.64)" text-anchor="middle" dominant-baseline="central">R</text><text x="101.35" y="75.05" transform="rotate(110.0 101.35 75.05)" text-anchor="middle" dominant-baseline="central">A</text><text x="98.11" y="82.00" transform="rotate(120.0 98.11 82.00)" text-anchor="middle" dominant-baseline="central">S</text><text x="93.71" y="88.28" transform="rotate(130.0 93.71 88.28)" text-anchor="middle" dominant-baseline="central">I</text><text x="88.28" y="93.71" transform="rotate(140.0 88.28 93.71)" text-anchor="middle" dominant-baseline="central">L</text><text x="75.05" y="101.35" transform="rotate(160.0 75.05 101.35)" text-anchor="middle" dominant-baseline="central">•</text><text x="60.00" y="104.00" transform="rotate(180.0 60.00 104.00)" text-anchor="middle" dominant-baseline="central">F</text><text x="52.36" y="103.33" transform="rotate(190.0 52.36 103.33)" text-anchor="middle" dominant-baseline="central">E</text><text x="44.95" y="101.35" transform="rotate(200.0 44.95 101.35)" text-anchor="middle" dominant-baseline="central">I</text><text x="38.00" y="98.11" transform="rotate(210.0 38.00 98.11)" text-anchor="middle" dominant-baseline="central">T</text><text x="31.72" y="93.71" transform="rotate(220.0 31.72 93.71)" text-anchor="middle" dominant-baseline="central">A</text><text x="21.89" y="82.00" transform="rotate(240.0 21.89 82.00)" text-anchor="middle" dominant-baseline="central">N</text><text x="18.65" y="75.05" transform="rotate(250.0 18.65 75.05)" text-anchor="middle" dominant-baseline="central">O</text><text x="16.00" y="60.00" transform="rotate(270.0 16.00 60.00)" text-anchor="middle" dominant-baseline="central">B</text><text x="16.67" y="52.36" transform="rotate(280.0 16.67 52.36)" text-anchor="middle" dominant-baseline="central">R</text><text x="18.65" y="44.95" transform="rotate(290.0 18.65 44.95)" text-anchor="middle" dominant-baseline="central">A</text><text x="21.89" y="38.00" transform="rotate(300.0 21.89 38.00)" text-anchor="middle" dominant-baseline="central">S</text><text x="26.29" y="31.72" transform="rotate(310.0 26.29 31.72)" text-anchor="middle" dominant-baseline="central">I</text><text x="31.72" y="26.29" transform="rotate(320.0 31.72 26.29)" text-anchor="middle" dominant-baseline="central">L</text><text x="44.95" y="18.65" transform="rotate(340.0 44.95 18.65)" text-anchor="middle" dominant-baseline="central">•</text></g>
<polygon points="60,40 81,60 60,80 39,60" fill="none" stroke="#F8D65B" stroke-width="2"></polygon>
<circle cx="60" cy="60" r="7.5" fill="#90E04B"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: rgba(238,232,218,0.72)"><a href="#" style="color: #EEE8DA">INSTAGRAM</a><a href="#" style="color: #EEE8DA">TIKTOK</a></div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
<button type="button" onClick="{{togglePass}}" aria-expanded="{{passExpanded}}" aria-controls="form-senha" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #EEE8DA; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">TEM A SENHA? ENTRAR NA LOJA</button>
<sc-if value="{{passOpen}}" hint-placeholder-val="{{false}}">
<form id="form-senha" style="display: flex"><label for="senha-loja" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Senha da loja</label><input id="senha-loja" type="password" placeholder="Senha" style="min-height: 52px; padding: 0 16px; border: 1px solid rgba(238,232,218,0.5); background: transparent; color: #EEE8DA; font-size: 16px; font-family: inherit; border-radius: 0; box-sizing: border-box; min-width: 0; width: 200px"><a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border: 1px solid #EEE8DA; background: transparent; color: #EEE8DA; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; font-weight: 500; cursor: pointer; border-left: 0">ENTRAR</a></form>
</sc-if>
</div>
</footer>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    return {
      notSent: !s.sent,
      sent: !!s.sent,
      send: (e) => { if (e) e.preventDefault(); this.setState({ sent: true }); },
      passOpen: !!s.pass,
      passExpanded: s.pass ? 'true' : 'false',
      togglePass: () => this.setState({ pass: !s.pass })
    };
  }

}
</script>
</body>
</html>
